<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--VERDANT-->
<!--LEAFLET-->
<style>
  #map { height: 300px; border-bottom: 1px solid var(--line); }
  body.browser #map { height: 520px; }
  .stop { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .stop:hover { background: var(--mint); }
  .stop:last-child { border-bottom: 0; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--forest); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
  .num.done { background: #9aa8a1; }
  .when { width: 74px; font-weight: 600; flex: none; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; }
  .who span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .pin { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--forest); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); display: grid; place-items: center; }
  .pin span { transform: rotate(45deg); color: #fff; font-weight: 700; font-size: 12px; }
  .pin.done { background: #9aa8a1; }
</style>
</head>
<body>
<div class="card">
  <div class="head"><div class="logo">V</div><h1 id="title">My day</h1><div class="sub" id="summary"></div></div>
  <div id="map"></div>
  <div id="list"><div class="loading">Loading the schedule…</div></div>
</div>
<script type="module">
const V = window.Verdant;
const CLOSED = ["Completed", "Canceled", "Cannot Complete"];
let map;

function render(data) {
  const visits = data.visits || [];
  const day = new Date(data.day + "T12:00:00");
  document.getElementById("title").textContent =
    (data.day === data.today ? "Today, " : "") + day.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
  document.getElementById("summary").textContent = visits.length === 1 ? "1 visit" : `${visits.length} visits`;

  const list = document.getElementById("list");
  if (!visits.length) {
    list.innerHTML = '<div class="loading">No visits booked for this day.</div>';
  } else {
    list.innerHTML = visits.map((v, i) => {
      const done = CLOSED.includes(v.status);
      const coverage = v.coverage ? `<span class="badge ${v.coverage === "Covered" ? "" : "warn"}">${V.esc(v.coverage)}</span>` : "";
      const status = done ? `<span class="badge done">${V.esc(v.status)}</span>` : "";
      return `<div class="stop" data-i="${i}">
        <div class="num ${done ? "done" : ""}">${i + 1}</div>
        <div class="when">${V.esc(V.time(v.startTimeLocal))}</div>
        <div class="who"><b>${V.esc(v.accountName)}</b><span>${V.esc(v.workType)} · ${V.esc(v.address)}</span></div>
        ${coverage} ${status}
      </div>`;
    }).join("");
    list.querySelectorAll(".stop").forEach((row) => row.addEventListener("click", () => {
      const v = visits[Number(row.dataset.i)];
      V.say(`Brief me on my ${V.time(v.startTimeLocal)} visit with ${v.accountName}.`);
    }));
  }
  drawMap(visits);
}

function drawMap(visits) {
  if (!map) {
    map = L.map("map", { zoomControl: true, attributionControl: true, scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
  }
  const points = [];
  visits.forEach((v, i) => {
    if (v.latitude == null || v.longitude == null) return;
    const done = CLOSED.includes(v.status);
    const icon = L.divIcon({ className: "", html: `<div class="pin ${done ? "done" : ""}"><span>${i + 1}</span></div>`, iconSize: [28, 28], iconAnchor: [14, 28] });
    L.marker([v.latitude, v.longitude], { icon }).addTo(map)
      .bindTooltip(`${V.time(v.startTimeLocal)} · ${v.accountName}`, { direction: "top", offset: [0, -26] });
    points.push([v.latitude, v.longitude]);
  });
  if (points.length > 1) {
    L.polyline(points, { color: "#1f4d3a", weight: 3, opacity: .7, dashArray: "6 6" }).addTo(map);
  }
  if (points.length) {
    map.fitBounds(points, { padding: [36, 36], maxZoom: 15 });
  } else {
    map.setView([41.957, -88.081], 13); // Bloomingdale, IL
  }
}

V.app.ontoolresult = (result) => {
  const data = V.parse(result);
  if (typeof data === "object" && data) render(data);
  else V.error(document.getElementById("list"), data || "No schedule returned.");
};
await V.connect();
</script>
</body>
</html>
