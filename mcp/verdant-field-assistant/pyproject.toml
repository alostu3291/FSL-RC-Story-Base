[project]
name = "verdant-field-assistant"
version = "0.1.0"
description = "MCP server that runs the Verdant pest control demo from an LLM, with Salesforce Revenue Cloud and Field Service behind it."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pillow>=10",
    "pymupdf>=1.24",
]

[project.scripts]
verdant-field-assistant = "verdant_assistant.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdant_assistant"]
