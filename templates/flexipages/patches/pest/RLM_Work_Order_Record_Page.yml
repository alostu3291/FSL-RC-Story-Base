feature: pest
feature_flag: pest
# Treatment checklist (inspection findings, before/after photos) at the top of the Work Order page,
# and the re-service response milestone tracker under Service Appointments.
patches:
  - type: add_component
    region: sidebar
    component: "support:milestones"
    identifier: support_milestones
    after_identifier: force_relatedListSingleContainer_serviceAppointments
    properties:
      hideMarkCompleteButton: "false"
  - type: insert_action
    after: "WorkOrder.RLM_Flag_Expansion"
    actions:
      - "WorkOrder.RLM_RTK_Treatment"
      - "WorkOrder.RLM_RTK_Inspect_and_Quote"
  - type: insert_after_xml
    anchor: |-
      <name>maintabs</name>
              <type>Facet</type>
          </flexiPageRegions>
          <flexiPageRegions>
    xml: |2
              <itemInstances>
                  <componentInstance>
                      <componentName>rlmRtkTreatmentChecklist</componentName>
                      <identifier>c_rlmRtkTreatmentChecklist</identifier>
                  </componentInstance>
              </itemInstances>
