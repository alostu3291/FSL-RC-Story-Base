feature: hvac
feature_flag: hvac
# Service checklist (tune-up steps, approved repairs, before/after photos) at the top of the Work Order page,
# and the priority response milestone tracker under Service Appointments.
patches:
  - type: add_component
    region: sidebar
    component: "support:milestones"
    identifier: support_milestones
    after_identifier: force_relatedListSingleContainer_serviceAppointments
    properties:
      hideMarkCompleteButton: "false"
  - type: insert_action
    after: "WorkOrder.RLM_Flag_Expansion"
    actions:
      - "WorkOrder.RLM_HVAC_Service_Checklist"
      - "WorkOrder.RLM_HVAC_Replacement_Options"
      - "WorkOrder.RLM_HVAC_Check_and_Quote"
  - type: insert_after_xml
    anchor: |-
      <name>maintabs</name>
              <type>Facet</type>
          </flexiPageRegions>
          <flexiPageRegions>
    xml: |2
              <itemInstances>
                  <componentInstance>
                      <componentName>rlmHvacServiceChecklist</componentName>
                      <identifier>c_rlmHvacServiceChecklist</identifier>
                  </componentInstance>
              </itemInstances>
