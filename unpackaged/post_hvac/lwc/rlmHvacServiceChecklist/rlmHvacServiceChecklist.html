<template>
    <template lwc:if={hasState}>
        <section class="card">
            <header class="head">
                <div>
                    <p class="eyebrow">{eyebrow}</p>
                    <h2>{heading}</h2>
                </div>
                <div class="count">
                    <strong>{completed} / {total}</strong>
                    <span>done</span>
                </div>
            </header>
            <div class="progress-track"><div class="progress-fill" style={progressStyle}></div></div>
            <template lwc:if={allDone}>
                <p class="done-note">Everything is done. Add after photos if you haven't, then complete the work order.</p>
            </template>
            <template lwc:if={error}>
                <p class="error" role="alert">{error}</p>
            </template>

            <div class="section-head">
                <h3>Standard steps</h3>
                <span>{stepCount}</span>
            </div>
            <ul class="steps">
                <template for:each={steps} for:item="s">
                    <li key={s.key} class={s.rowClass}>
                        <button
                            type="button"
                            class={s.checkClass}
                            data-key={s.key}
                            aria-pressed={s.ariaPressed}
                            aria-label={s.label}
                            disabled={s.busy}
                            onclick={toggleStep}
                        ></button>
                        <span class="step-label">{s.label}</span>
                        <template lwc:if={s.readingHint}>
                            <lightning-input
                                class="step-reading"
                                label={s.readingLabel}
                                variant="label-hidden"
                                placeholder={s.readingHint}
                                data-key={s.key}
                                value={s.readingValue}
                                onchange={handleStepReading}
                                onblur={saveStepReading}
                            ></lightning-input>
                        </template>
                    </li>
                </template>
            </ul>

            <template lwc:if={hasFindings}>
                <div class="section-head">
                    <h3>Repairs and findings</h3>
                    <span>{findingCount}</span>
                </div>
                <template for:each={findings} for:item="f">
                    <article key={f.id} class={f.cardClass}>
                        <div class="finding-head">
                            <div>
                                <span class="area">{f.equipment}</span>
                                <strong>{f.observation}</strong>
                            </div>
                            <span class={f.urgencyClass}>{f.urgency}</span>
                        </div>

                        <template lwc:if={f.customerNote}>
                            <p class="note">{f.customerNote}</p>
                        </template>
                        <template lwc:if={f.internalNote}>
                            <p class="note internal"><span>Technician</span>{f.internalNote}</p>
                        </template>
                        <template lwc:if={f.recommendedProductName}>
                            <p class="plan">Repair: {f.recommendedProductName}</p>
                        </template>

                        <div class="photo-row">
                            <div class="photo-group">
                                <span class="photo-label">Before</span>
                                <div class="photos">
                                    <template for:each={f.beforePhotos} for:item="p">
                                        <button key={p.versionId} type="button" class="thumb" data-url={p.url} data-title={p.title} onclick={previewPhoto} title={p.title}>
                                            <img src={p.url} alt={p.title} />
                                        </button>
                                    </template>
                                    <template lwc:if={f.noBefore}>
                                        <span class="none">No photos</span>
                                    </template>
                                </div>
                            </div>
                            <div class="photo-group">
                                <span class="photo-label after">After</span>
                                <div class="photos">
                                    <template for:each={f.afterThumbs} for:item="p">
                                        <button key={p.versionId} type="button" class="thumb" data-url={p.url} data-title={p.title} onclick={previewPhoto} title={p.title}>
                                            <img src={p.url} alt={p.title} />
                                        </button>
                                    </template>
                                    <c-rlm-hvac-photo-capture
                                        label="Add after photos"
                                        stage="After"
                                        record-id={f.id}
                                        onuploaded={handleAfterUpload}
                                    ></c-rlm-hvac-photo-capture>
                                </div>
                            </div>
                        </div>

                        <lightning-input
                            label="Reading after the repair"
                            placeholder="e.g. 45 µF"
                            data-id={f.id}
                            value={f.readingValue}
                            onchange={handleReading}
                        ></lightning-input>
                        <lightning-textarea
                            label="What you did"
                            placeholder="e.g. Replaced 45/5 µF run capacitor; cleaned condenser coil"
                            data-id={f.id}
                            value={f.noteValue}
                            onchange={handleNote}
                        ></lightning-textarea>

                        <div class="actions">
                            <template for:each={f.statuses} for:item="s">
                                <button
                                    key={s.value}
                                    type="button"
                                    class={s.cls}
                                    data-id={f.id}
                                    data-value={s.value}
                                    aria-pressed={s.ariaPressed}
                                    disabled={f.busy}
                                    onclick={setStatus}
                                >
                                    {s.label}
                                </button>
                            </template>
                            <button type="button" class="link" data-id={f.id} disabled={f.busy} onclick={saveNote}>
                                Save note
                            </button>
                        </div>
                    </article>
                </template>
            </template>
        </section>
    </template>
    <template lwc:elseif={showEmpty}>
        <p class="empty">No checklist for this work order.</p>
    </template>
    <template lwc:elseif={error}>
        <p class="error" role="alert">{error}</p>
    </template>
    <template lwc:if={viewing}>
        <c-rlm-file-viewer url={viewing.url} title={viewing.title} onclose={closePhoto}></c-rlm-file-viewer>
    </template>
</template>
