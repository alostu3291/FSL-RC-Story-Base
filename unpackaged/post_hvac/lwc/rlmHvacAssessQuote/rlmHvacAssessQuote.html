<template>
    <div class="shell">
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Field check &amp; quote</p>
                <h1 class="title">{accountName}</h1>
                <p class="subtitle">Check the equipment, capture findings, and price the comfort agreement on site.</p>
            </div>
            <div if:true={hasZip} class="zip-badge" title="Service ZIP drives location pricing">
                <lightning-icon icon-name="utility:checkin" size="x-small" alternative-text=""></lightning-icon>
                <div>
                    <span class="zip-label">Service ZIP</span>
                    <strong class="zip-value">{postalCode}</strong>
                </div>
            </div>
        </header>

        <template lwc:if={safetyFlag}>
            <section class="section override" role="alert">
                <div class="section-head">
                    <h2>Safety finding</h2>
                    <p>The system check found a safety issue. Explain it to the customer before quoting, and fix it before the system runs normally.</p>
                </div>
            </section>
        </template>

        <section class="section">
            <div class="section-head">
                <h2>Choose a comfort agreement</h2>
                <p>{planSubtitle}</p>
            </div>
            <div class="plan-grid" role="listbox" aria-label="Recommended agreement">
                <template for:each={plans} for:item="plan">
                    <button
                        key={plan.sku}
                        type="button"
                        class={plan.cardClass}
                        data-sku={plan.sku}
                        aria-pressed={plan.ariaPressed}
                        onclick={selectPlan}
                    >
                        <template if:true={plan.recommended}>
                            <span class="rec-pill">Recommended</span>
                        </template>
                        <span class="plan-name">{plan.name}</span>
                        <template lwc:if={plan.hasPrice}>
                            <span class="plan-price"
                                ><span class="plan-from">from</span
                                ><span class="plan-amount">{plan.priceLabel}</span
                                ><span class="plan-per">/mo per system</span></span
                            >
                        </template>
                        <span class="plan-blurb">{plan.blurb}</span>
                        <ul class="plan-features">
                            <template for:each={plan.features} for:item="feat">
                                <li key={feat}>{feat}</li>
                            </template>
                        </ul>
                        <template lwc:if={plan.hasBecause}>
                            <div class="because">
                                <span class="because-label">Because</span>
                                <ul>
                                    <template for:each={plan.because} for:item="b">
                                        <li key={b.key}>{b.text}</li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </button>
                </template>
            </div>
        </section>

        <section class="section">
            <div class="section-head row">
                <div>
                    <h2>The home's systems</h2>
                    <p>Pick the main system type and how many systems the agreement covers.</p>
                </div>
                <div class="sqft-readout">
                    <div class="stepper" role="group" aria-label="Number of systems">
                        <lightning-button-icon
                            icon-name="utility:dash"
                            alternative-text="One fewer system"
                            disabled={cannotRemoveSystem}
                            onclick={removeSystem}
                        ></lightning-button-icon>
                        <strong>{systemCountLabel}</strong>
                        <lightning-button-icon
                            icon-name="utility:add"
                            alternative-text="One more system"
                            disabled={cannotAddSystem}
                            onclick={addSystem}
                        ></lightning-button-icon>
                    </div>
                </div>
            </div>
            <div class="prop-grid" role="group" aria-label="System type">
                <template for:each={systemTypes} for:item="type">
                    <button
                        key={type.value}
                        type="button"
                        class={type.tileClass}
                        data-value={type.value}
                        aria-pressed={type.ariaPressed}
                        onclick={selectSystemType}
                    >
                        <lightning-icon icon-name={type.icon} size="medium" alternative-text=""></lightning-icon>
                        <span class="prop-label">{type.label}</span>
                        <span class="prop-hint">{type.hint}</span>
                    </button>
                </template>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <h2>Equipment age</h2>
                <template lwc:if={ageFromAssessment}>
                    <p>The data plate puts the oldest system at <strong>{ageFromAssessment}</strong>.</p>
                </template>
                <template lwc:else>
                    <p>Age of the oldest system. Older equipment adds a small monthly adjustment per system.</p>
                </template>
            </div>
            <div class="sev-meter" role="group" aria-label="Equipment age">
                <template for:each={ageBands} for:item="band">
                    <button
                        key={band.value}
                        type="button"
                        class={band.chipClass}
                        data-value={band.value}
                        aria-pressed={band.ariaPressed}
                        onclick={selectAge}
                    >
                        <span class="sev-label">{band.label}</span>
                        <span class="sev-hint">{band.hint}</span>
                        <span class="sev-adj">{band.adjustment}</span>
                    </button>
                </template>
            </div>
        </section>

        <template lwc:if={hasPricing}>
            <section class="section price-box" aria-label="Price for this home">
                <div class="section-head">
                    <h2>Price for this home</h2>
                    <p>How the monthly agreement price is built. The age adjustment comes off when the equipment is replaced.</p>
                </div>
                <dl class="price-lines">
                    <div><dt>{breakdown.planName} list price</dt><dd>{breakdown.list}/mo</dd></div>
                    <div><dt>Zone: {breakdown.zoneLabel}</dt><dd>{breakdown.zoneAmount}</dd></div>
                    <div><dt>Equipment age: {breakdown.ageLabel}</dt><dd>{breakdown.ageAmount}</dd></div>
                    <div><dt>Per system</dt><dd>{breakdown.perSystem}/mo</dd></div>
                    <div class="total">
                        <dt>
                            {breakdown.planName}, {breakdown.systemsLabel}
                            <template lwc:if={breakdown.hasAdjustment}>
                                <span class="sub">includes {breakdown.adjustment}/mo per system age adjustment</span>
                            </template>
                        </dt>
                        <dd>{breakdown.planTotal}/mo</dd>
                    </div>
                    <template for:each={breakdown.addOns} for:item="a">
                        <div key={a.key}><dt>{a.label} <span class="sub">per home</span></dt><dd>{a.amount}</dd></div>
                    </template>
                    <template lwc:if={breakdown.hasAddOns}>
                        <div class="total"><dt>Monthly total</dt><dd>{breakdown.monthly}/mo</dd></div>
                    </template>
                    <template lwc:if={breakdown.tuneUp}>
                        <div class="one-time"><dt>Initial Tune-up, {breakdown.systemsLabel}, one time</dt><dd>{breakdown.tuneUp}</dd></div>
                    </template>
                    <template for:each={breakdown.repairs} for:item="r">
                        <div key={r.key} class="one-time"><dt>{r.label}, one time <span class="sub">{breakdown.repairDiscountLabel}</span></dt><dd>{r.amount}</dd></div>
                    </template>
                    <template lwc:if={breakdown.hasRepairs}>
                        <div class="total"><dt>Due today</dt><dd>{breakdown.oneTime}</dd></div>
                    </template>
                </dl>
            </section>
        </template>

        <section class="section">
            <div class="section-head">
                <h2>Add-ons</h2>
                <p>Toggle cards. The Initial Tune-up is always added automatically.</p>
            </div>
            <div class="addon-grid">
                <button type="button" class={iaqCardClass} aria-pressed={includeIaq} onclick={toggleIaq}>
                    <div class="addon-icon iaq" aria-hidden="true">
                        <lightning-icon icon-name="utility:world" size="small" alternative-text=""></lightning-icon>
                    </div>
                    <div class="addon-copy">
                        <strong>Indoor air quality {iaqPrice}</strong>
                        <span>UV lamp care and four filter changes a year</span>
                        <template lwc:if={hasIaqReasons}>
                            <ul class="because-inline">
                                <template for:each={iaqReasons} for:item="b">
                                    <li key={b.key}>{b.text}</li>
                                </template>
                            </ul>
                        </template>
                    </div>
                    <span class="addon-switch" aria-hidden="true">
                        <span class="knob"></span>
                    </span>
                </button>
                <button type="button" class={waterHeaterCardClass} aria-pressed={includeWaterHeater} onclick={toggleWaterHeater}>
                    <div class="addon-icon heater" aria-hidden="true">
                        <lightning-icon icon-name="utility:water" size="small" alternative-text=""></lightning-icon>
                    </div>
                    <div class="addon-copy">
                        <strong>Water heater care {waterHeaterPrice}</strong>
                        <span>Annual flush and anode check</span>
                        <template lwc:if={hasWaterHeaterReasons}>
                            <ul class="because-inline">
                                <template for:each={waterHeaterReasons} for:item="b">
                                    <li key={b.key}>{b.text}</li>
                                </template>
                            </ul>
                        </template>
                    </div>
                    <span class="addon-switch" aria-hidden="true">
                        <span class="knob"></span>
                    </span>
                </button>
            </div>
        </section>

        <template lwc:if={hasRepairOptions}>
            <section class="section">
                <div class="section-head">
                    <h2>Repairs from the system check</h2>
                    <p>One-time work done on the Initial Tune-up visit. Tap to leave one out.</p>
                </div>
                <div class="addon-grid">
                    <template for:each={repairOptions} for:item="r">
                        <button
                            key={r.sku}
                            type="button"
                            class={r.cardClass}
                            data-sku={r.sku}
                            aria-pressed={r.ariaPressed}
                            onclick={toggleRepair}
                        >
                            <div class="addon-icon heater" aria-hidden="true">
                                <lightning-icon icon-name="utility:custom_apps" size="small" alternative-text=""></lightning-icon>
                            </div>
                            <div class="addon-copy">
                                <strong>{r.label} {r.price}</strong>
                                <template lwc:if={r.hasBecause}>
                                    <ul class="because-inline">
                                        <template for:each={r.because} for:item="b">
                                            <li key={b.key}>{b.text}</li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                            <span class="addon-switch" aria-hidden="true">
                                <span class="knob"></span>
                            </span>
                        </button>
                    </template>
                </div>
            </section>
        </template>

        <template lwc:if={replacementRecommended}>
            <section class="section">
                <div class="section-head">
                    <h2>Replacement recommended</h2>
                    <p>The equipment is near the end of its life. After this quote, open Replacement Options on the work order for good, better and best systems.</p>
                </div>
            </section>
        </template>

        <template lwc:if={isOverridden}>
            <section class="section override">
                <div class="section-head">
                    <h2>Changed from the system check</h2>
                    <p>{changeSummary}</p>
                </div>
                <lightning-textarea
                    label="Why are you changing the recommendation?"
                    required
                    value={overrideNote}
                    onchange={handleOverride}
                ></lightning-textarea>
            </section>
        </template>

        <footer class="summary">
            <div>
                <span class="summary-label">Ready to quote</span>
                <p class="summary-bits">{summaryBits}</p>
            </div>
            <p class="summary-hint">Tap <strong>Create Quote</strong> below. The Initial Tune-up is included.</p>
        </footer>
    </div>
</template>
