<template>
    <template lwc:if={hasFindings}>
        <section class="card">
            <header class="head">
                <div>
                    <p class="eyebrow">Your system check · {state.assessmentName}</p>
                    <h2>What we found</h2>
                </div>
                <div class="meta">
                    <span>{findingCount} findings</span>
                    <span>{photoCount} photos</span>
                    <span class={urgencyClass}>{urgency}</span>
                </div>
            </header>
            <template lwc:if={replacementRecommended}>
                <div class="why">
                    <p class="why-label">Replacement</p>
                    <p>Your equipment is near the end of its life. Ask your technician for good, better and best replacement options.</p>
                </div>
            </template>
            <template lwc:if={state.planExplanation}>
                <div class="why">
                    <p class="why-label">Why we recommend this agreement</p>
                    <p>{state.planExplanation}</p>
                </div>
            </template>
            <template lwc:if={state.priceNote}>
                <div class="why">
                    <p class="why-label">How your price is set</p>
                    <p>{state.priceNote}</p>
                </div>
            </template>
            <div class="list">
                <template for:each={findings} for:item="f">
                    <article key={f.id} class="finding">
                        <div class="finding-head">
                            <div>
                                <span class="area">{f.equipment}</span>
                                <strong>{f.observation}</strong>
                            </div>
                            <span class={f.sevClass}>{f.urgencyLabel}</span>
                        </div>
                        <template lwc:if={f.equipmentLine}>
                            <p class="note">{f.equipmentLine}</p>
                        </template>
                        <template lwc:if={f.reading}>
                            <p class="note">Reading: {f.reading}</p>
                        </template>
                        <template lwc:if={f.customerNote}>
                            <p class="note">{f.customerNote}</p>
                        </template>
                        <template lwc:if={f.hasPhotos}>
                            <div class="photos">
                                <template for:each={f.photos} for:item="p">
                                    <button
                                        key={p.versionId}
                                        type="button"
                                        class="photo"
                                        data-url={p.url}
                                        data-title={p.title}
                                        onclick={previewPhoto}
                                        title={p.title}
                                    >
                                        <img src={p.url} alt={p.title} />
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={f.recommendedProductName}>
                            <p class="fix">Addressed by your <strong>{f.recommendedProductName}</strong></p>
                        </template>
                    </article>
                </template>
            </div>
        </section>
    </template>
    <template lwc:elseif={error}>
        <p class="error">{error}</p>
    </template>
    <template lwc:if={viewing}>
        <c-rlm-file-viewer url={viewing.url} title={viewing.title} onclose={closePhoto}></c-rlm-file-viewer>
    </template>
</template>
