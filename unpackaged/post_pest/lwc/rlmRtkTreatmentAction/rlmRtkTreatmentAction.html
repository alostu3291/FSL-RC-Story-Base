<template>
    <template lwc:if={recordId}>
        <c-rlm-rtk-visit-brief record-id={recordId}></c-rlm-rtk-visit-brief>
        <c-rlm-rtk-treatment-checklist class="checklist" record-id={recordId}></c-rlm-rtk-treatment-checklist>
        <c-rlm-rtk-find-and-add record-id={recordId} onfindingadded={handleFindingAdded}></c-rlm-rtk-find-and-add>
        <c-rlm-rtk-plan-change class="plan-change" record-id={recordId}></c-rlm-rtk-plan-change>
        <div class="complete">
            <template lwc:if={completedNumber}>
                <p class="done">Work order {completedNumber} and its appointment are complete. Any approved add-ons are being billed.</p>
                <c-rlm-rtk-visit-summary record-id={recordId}></c-rlm-rtk-visit-summary>
                <button type="button" class="primary" onclick={close}>Close</button>
            </template>
            <template lwc:else>
                <template lwc:if={error}>
                    <p class="error">{error}</p>
                </template>
                <button type="button" class="primary" disabled={busy} onclick={complete}>Complete treatment</button>
                <p class="hint">Completes this appointment and work order.</p>
            </template>
        </div>
    </template>
</template>
